<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>童话阅读</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(160deg, #e8d8f8 0%, #d8c8f0 40%, #e0d0f5 100%);
            background-attachment: fixed;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '幼圆', sans-serif;
            min-height: 100vh;
            padding: 1.2rem 0.8rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #3d2c1e;
        }

        /* ---------- 标题区 ---------- */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #4a2a6a;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0 #c8a8e8;
        }

        .header p {
            font-size: 0.95rem;
            color: #6a3a8a;
            font-weight: 600;
            background: #f5edff;
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            box-shadow: 0 3px 0 #c8a8e0;
        }

        /* ---------- 卡片网格 ---------- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1100px;
            width: 100%;
        }

        /* ---------- 卡片 ---------- */
        .card {
            perspective: 1200px;
            height: 400px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.55s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 22px;
            box-shadow: 0 8px 20px -6px rgba(100, 60, 140, 0.3);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid #ffffff90;
            background: linear-gradient(145deg, #f5edff 0%, #e8d8f8 100%);
        }

        /* ---------- 正面 ---------- */
        .card-front {
            align-items: center;
            text-align: center;
        }

        /* ---------- 背面 ---------- */
        .card-back {
            transform: rotateY(180deg);
            overflow-y: auto;
        }

        /* ---------- 左上角序号 ---------- */
        .badge {
            position: absolute;
            top: 14px;
            left: 16px;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.28rem 0.9rem;
            border-radius: 20px;
            letter-spacing: 0.5px;
            border: 1.5px solid #ffffffa0;
            background: #b088e0;
            color: #2d1a4a;
            box-shadow: 0 2px 0 #8460b0;
            z-index: 2;
        }

        .card-back .badge {
            background: #9a78c8;
            color: #ffffff;
            box-shadow: 0 2px 0 #7050a0;
        }

        /* ---------- 右上角故事名 ---------- */
        .story-name {
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.28rem 0.9rem;
            border-radius: 20px;
            letter-spacing: 0.3px;
            border: 1.5px solid #ffffffa0;
            background: #f5edff;
            color: #6a3a8a;
            box-shadow: 0 2px 0 #c8a8e0;
            z-index: 2;
        }

        /* ---------- 正面内部布局 ---------- */
        .front-top {
            padding: 2.8rem 1.2rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }

        .front-middle {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1.4rem;
            width: 100%;
        }

        .front-bottom {
            padding: 0 1.2rem 1.4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        /* ---------- 问题文字 ---------- */
        .question {
            font-size: 1.2rem;
            line-height: 1.85;
            font-weight: 600;
            color: #3d2c1e;
            text-align: center;
        }

        /* ---------- 点击提示 ---------- */
        .tap-hint {
            font-size: 0.82rem;
            color: #7a4a9a;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: #f0e4ff;
            padding: 0.32rem 1.1rem;
            border-radius: 20px;
            box-shadow: 0 2px 0 #c8a8e0;
        }

        /* ---------- 分类标签 ---------- */
        .category-tag {
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.25rem 0.9rem;
            border-radius: 20px;
            background: #eadcff;
            color: #6b3fa0;
        }

        /* ---------- 语音播放按钮 ---------- */
        .play-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #c088e0 0%, #9a68c8 100%);
            border: none;
            border-radius: 30px;
            padding: 0.55rem 1.3rem 0.55rem 1.1rem;
            cursor: pointer;
            box-shadow: 0 3px 0 #8460b0, 0 6px 14px -4px rgba(100, 60, 140, 0.45);
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        .play-btn:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }

        .play-btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 #8460b0;
        }

        .play-btn .ico {
            width: 20px;
            height: 20px;
            flex: none;
        }

        .play-btn .bars {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 3px;
            width: 20px;
            height: 20px;
            flex: none;
        }

        .play-btn .bars i {
            display: block;
            width: 3px;
            border-radius: 2px;
            background: #fff;
            height: 7px;
            animation: bar-bounce 0.9s ease-in-out infinite;
        }

        .play-btn .bars i:nth-child(2) { animation-delay: 0.15s; }
        .play-btn .bars i:nth-child(3) { animation-delay: 0.3s; }

        .play-btn.playing {
            background: linear-gradient(135deg, #e07a7a 0%, #c85a6a 100%);
            box-shadow: 0 3px 0 #a04858, 0 6px 14px -4px rgba(200, 90, 106, 0.45);
        }

        .play-btn.playing .ico { display: none; }
        .play-btn.playing .bars { display: flex; }

        @keyframes bar-bounce {
            0%, 100% { height: 7px; }
            50% { height: 18px; }
        }

        .front-bottom .play-btn {
            margin-top: 0.2rem;
        }

        .back-play-wrap {
            display: flex;
            justify-content: center;
            padding: 0.6rem 1.2rem 0.2rem;
            width: 100%;
        }

        /* ---------- 背面答案区（居中 + 两端对齐） ---------- */
        .answer-list {
            padding: 3.2rem 1.8rem 0.8rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .answer-item {
            font-size: 1rem;
            line-height: 1.85;
            color: #1e3348;
            margin-bottom: 1.1rem;
            width: 100%;
            max-width: 280px;
            text-align: justify;
            text-justify: inter-ideograph;
            letter-spacing: 0.3px;
        }

        .answer-item:last-child {
            margin-bottom: 0;
        }

        .back-footer {
            margin-top: auto;
            padding: 0.8rem 1.2rem 1.2rem;
            font-size: 0.75rem;
            color: #7a5a9a;
            text-align: center;
            width: 100%;
        }

        /* ---------- 滚动条 ---------- */
        .card-back::-webkit-scrollbar {
            width: 5px;
        }

        .card-back::-webkit-scrollbar-thumb {
            background: #b088e0;
            border-radius: 10px;
        }

        /* ---------- 页脚 ---------- */
        footer {
            margin-top: 2.5rem;
            font-size: 0.85rem;
            color: #6a3a8a;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: #f5edff;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            box-shadow: 0 3px 0 #c8a8e0;
        }

        /* ---------- 手机适配 ---------- */
        @media (max-width: 600px) {
            body {
                padding: 1rem 0.6rem 2rem;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .card-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }

            .card {
                height: 370px;
            }

            .question {
                font-size: 1.08rem;
                line-height: 1.8;
            }

            .answer-item {
                font-size: 0.95rem;
                line-height: 1.8;
                margin-bottom: 0.9rem;
                max-width: 260px;
            }

            .front-top {
                padding: 2.6rem 1rem 0;
            }

            .front-middle {
                padding: 0.4rem 1.2rem;
            }

            .front-bottom {
                padding: 0 1rem 1.2rem;
            }

            .answer-list {
                padding: 3rem 1.2rem 0.6rem;
            }

            .story-name {
                font-size: 0.7rem;
                padding: 0.25rem 0.7rem;
                right: 12px;
                top: 12px;
            }

            .badge {
                font-size: 0.75rem;
                padding: 0.25rem 0.7rem;
                left: 12px;
                top: 12px;
            }
        }

        /* ---------- 小屏手机 ---------- */
        @media (max-width: 380px) {
            .card {
                height: 400px;
            }

            .question {
                font-size: 1rem;
            }

            .answer-item {
                font-size: 0.9rem;
                max-width: 240px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>童话阅读 </h1>
        <p>点一点卡片，翻开答案</p>
    </div>

    <div class="card-grid" id="cardGrid"></div>

    <footer>安徒生 · 稻草人 · 延伸阅读</footer>

    <script>
        // ============================================================
        //  题库数据
        // ============================================================

        const cardsData = [
            // ---------- 安徒生童话 1-7 ----------
            {

                id: 7,

                category: '安徒生童话',

            // ---------- 稻草人 8-15 ----------
            {

                    '即使帮不上忙，也会一直守在田里，尽责地看着主人的稻子。'
                ]
            },
            {
                id: 9,
                type: 'strawman',
                category: '稻草人',
                storyName: '稻草人',
                question: '稻草人为什么很想帮助田里的人，却帮不了？',
                answer: [

            },
            {
                id: 10,
                type: 'strawman',

            },
            {
                id: 11,
                type: 'strawman',
                category: '稻草人',
                storyName: '梧桐子',
                question: '飞出去的那颗梧桐子最后怎么样了？',
                answer: [
                    '麻雀把它丢进又松又软的泥里；',
                    '下了春雨、刮了春风后它发芽扎根，慢慢长成一棵挺拔的小树。'

            },
            {
                id: 12,
                type: 'strawman',
                category: '稻草人',
                storyName: '古代英雄的石像',
                question: '古代英雄的石像最后为什么倒塌了？',
                answer: [
                    '石像骄傲，石块们不满，一起把他扔下去，石像半夜倒下摔碎。'

            },
            {
                id: 13,
                type: 'strawman',
                category: '稻草人',
                storyName: '盲人和聋人',
                question: '盲人和聋人对调残疾后，为什么后悔了？',
                answer: [
                    '他们看到、听到的都是让自己难受的事，才发现每个人都有自己的难处，盲目羡慕别人并不幸福。'
                ]
            },
            {
                id: 14,
                type: 'strawman',
                category: '稻草人',
                storyName: '火车头的经历',
                question: '这列火车是从哪里来的？它怎样送学生们去陈述意见？',
                answer: [
                    '它出身英国的机器厂，到中国来服务；',
                    '它载着学生们勇往直前，把他们送到要去的地方。'

            },
            {
                id: 15,
                type: 'strawman',
                category: '稻草人',
                storyName: '皇帝的新衣',
                question: '故事最后，老百姓和兵士大臣怎样对待皇帝？',
                answer: [
                    '大家一齐围住皇帝，喊“撕掉你的虚伪的衣裳”，兵士和大臣也跟着站到人民一边。'
                ]
            },
            // ---------- 附录 附1-附4 ----------
            {
                id: 16,
                type: 'appendix',
                category: '延伸阅读',
                storyName: '芳儿的梦',
                question: '芳儿的梦里，芳儿打算送给妈妈什么礼物？',
                answer: [
                    '用星星串成的项链。'
                ]
            },
            {
                id: 17,
                type: 'appendix',
                category: '延伸阅读',
                storyName: '一粒种子',
                question: '一粒种子，为什么农夫能把种子种开花？',
                answer: [
                    '农夫用心耕作，顺其自然，不刻意炫耀。'
                ]
            },
            {
                id: 18,
                type: 'appendix',
                category: '延伸阅读',
                storyName: '皇帝的新衣',
                question: '皇帝的新装，为什么只有小孩子敢说出真话？',
                answer: [
                    '孩子天真，没有虚荣心，不怕别人说自己愚蠢。'
                ]
            },
            {
                id: 19,
                type: 'appendix',
                category: '延伸阅读',
                storyName: '海的女儿',
                question: '海的女儿，小美人鱼为了王子付出了什么？',
                answer: [
                    '她用自己美妙的声音，换取人类的双腿。'
                ]
            }
        ];

        // ============================================================
        //  渲染
        // ============================================================

        const grid = document.getElementById('cardGrid');

        function formatAnswer(answerArr) {
            return answerArr.map(text =>
                `<div class="answer-item">${text}</div>`
            ).join('');
        }

        function getBadgeText(item) {
            if (item.type === 'appendix') return `附${item.id - 15}`;
            return `第 ${item.id} 题`;
        }

        // ============================================================
        //  语音播放
        // ============================================================

        let currentAudio = null;
        let currentBtn = null;

        function stopCurrent() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            if (currentBtn) {
                currentBtn.classList.remove('playing');
                currentBtn = null;
            }
        }

        function togglePlay(audio, btn) {
            if (currentAudio && currentAudio !== audio) stopCurrent();
            if (audio.paused) {
                audio.play().catch(() => {});
                currentAudio = audio;
                currentBtn = btn;
                btn.classList.add('playing');
            } else {
                stopCurrent();
            }
        }

        const speakerIcon =
            `<svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
        const barsIcon = `<span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>`;

        function makePlayBtn(label) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'play-btn';
            btn.innerHTML = speakerIcon + barsIcon + `<span>${label}</span>`;
            return btn;
        }

        function setupCardAudio(card, item) {
            const audioQ = new Audio(`q${item.id}.mp3`);
            const audioA = new Audio(`a${item.id}.mp3`);

            const btnQ = makePlayBtn('听题目');
            const btnA = makePlayBtn('听答案');

            btnQ.addEventListener('click', (e) => {
                e.stopPropagation();
                togglePlay(audioQ, btnQ);
            });
            btnA.addEventListener('click', (e) => {
                e.stopPropagation();
                togglePlay(audioA, btnA);
            });

            const releaseBtn = (btn, audio) => {
                btn.classList.remove('playing');
                if (currentAudio === audio) currentAudio = null;
                if (currentBtn === btn) currentBtn = null;
            };
            audioQ.addEventListener('ended', () => releaseBtn(btnQ, audioQ));
            audioA.addEventListener('ended', () => releaseBtn(btnA, audioA));

            card.querySelector('.front-bottom').appendChild(btnQ);

            const wrap = document.createElement('div');
            wrap.className = 'back-play-wrap';
            wrap.appendChild(btnA);
            card.querySelector('.card-back').insertBefore(wrap, card.querySelector('.back-footer'));

            return { audioQ, audioA };
        }

        cardsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';

            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <div class="badge">${getBadgeText(item)}</div>
                        <div class="story-name">${item.storyName}</div>
                        <div class="front-top"></div>
                        <div class="front-middle">
                            <div class="question">${item.question}</div>
                        </div>
                        <div class="front-bottom">
                            <div class="tap-hint">点我看答案</div>
                            <div class="category-tag">${item.category}</div>
                        </div>
                    </div>
                    <div class="card-back">
                        <div class="badge">${getBadgeText(item)}</div>
                        <div class="story-name">${item.storyName}</div>
                        <div class="answer-list">
                            ${formatAnswer(item.answer)}
                        </div>
                        <div class="back-footer">再点一下翻回去</div>
                    </div>
                </div>
            `;

            grid.appendChild(card);

            const cardAudio = setupCardAudio(card, item);

            // 翻面时停止本卡正在播放的声音
            card.addEventListener('click', () => {
                const playingHere = (currentAudio === cardAudio.audioQ || currentAudio === cardAudio.audioA);
                card.classList.toggle('flipped');
                if (playingHere) stopCurrent();
            });
        });

        // 防止双击选中
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mousedown', (e) => {
                if (e.detail > 1) e.preventDefault();
            });
        });
    </script>
</body>
</html>
